# Builds the Pintertag iOS app from this repo and uploads it to TestFlight.
# Run it from the Actions tab ("Run workflow"). Nothing runs on push.
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key ID
#   ASC_ISSUER_ID      App Store Connect API issuer ID
#   ASC_KEY_P8         the .p8 key file contents, pasted as-is
#   (ASC_KEY_P8_BASE64 base64 of the same file also works)
name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0)
        required: true
        default: 1.0.0
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build web bundle and sync iOS project
        run: npm ci --no-audit --no-fund && npm run sync
      - name: API key
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          if [ -n "$ASC_KEY_P8" ]; then printf '%s\n' "$ASC_KEY_P8" > "$KEY_FILE";
          else echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"; fi
          grep -q "BEGIN PRIVATE KEY" "$KEY_FILE" || { echo "API key secret missing or malformed"; exit 1; }
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      - name: Check App Store Connect API key
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import jwt, time, os, urllib.request, urllib.error
          kid, iss = os.environ["KID"], os.environ["ISS"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1", headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req); print("API key OK:", r.status)
          except urllib.error.HTTPError as e:
              print("API key rejected:", e.code, e.read().decode()[:400]); raise SystemExit(1)
          PY
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
      - name: Archive
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/Pintertag.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=${{ inputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          # The archive is unsigned on purpose: a development-signed archive needs a
          # registered device. The export step below signs it for App Store distribution.
      - name: Upload to App Store Connect (TestFlight)
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Pintertag.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
